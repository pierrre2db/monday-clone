services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monday
      POSTGRES_PASSWORD: monday
      POSTGRES_DB: monday
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monday"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://monday:monday@db:5432/monday?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: "10485760"
    ports:
      - "4000:3000"
    volumes:
      - uploads:/data/uploads
volumes:
  pgdata:
  uploads:
